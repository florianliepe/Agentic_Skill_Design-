name: Deploy Skill Design Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skill-studio-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run workflow:build
      - uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_SBO_API_URL: ${{ vars.NEXT_PUBLIC_SBO_API_URL }}
          NEXT_PUBLIC_SBO_ENABLED: ${{ vars.NEXT_PUBLIC_SBO_ENABLED }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
